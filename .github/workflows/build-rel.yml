name: Build Project (Release)

on:
  push:
    branches: [ "main", "x/oob/v0.1.x", "x/oob/v0.2.x", "x/exp/libmpv" ]
  pull_request:
    branches: [ "main", "x/oob/v0.1.x", "x/oob/v0.2.x", "x/exp/libmpv" ]
    
jobs:
  build:
    strategy:
      matrix:
        runs-on: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
          ref: ${{ github.ref }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Setup environment (Unix)
        if: matrix.runs-on == 'ubuntu-latest'
        run: sudo apt install mono-complete libmpv2
      - name: Setup environment (macOS)
        if: matrix.runs-on == 'macos-latest'
        run: |
          brew uninstall p7zip
          brew install mono sevenzip mpv
      - name: Solution Compilation
        run: |
          pip install py7zr aptivi-adt
          adt build -b "-p:Configuration=Release -p:ContinuousIntegrationBuild=true"
          adt checklocs
      - name: Test versions
        run: dotnet private/MediaBoom.Cli/bin/Release/net10.0/MediaBoom.Cli.dll --test
